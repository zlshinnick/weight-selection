seed: 42
model:
  name: vit_tiny_patch16_224
  num_classes: 0
  pretrained: false
  embed_dim: 192
  drop_path: 0.0
  layer_scale_init_value: 1.0e-06
  head_init_scale: 1.0
grid:
  H: 14
  W: 14
vocab:
  K: 130
  PAD_ID: 0
  MASK_ID: 1
dyck:
  k_open: 64
  k_close: 64
  open_prob: 0.6
  min_pairs: 1
dataset:
  n_samples: 20000
  num_workers: 4
  pin_memory: true
  use_shuffled: false
  batch_size: 256
  source: dyck_shuffle
training:
  batch_size: 256
  steps: 15000
  mask_ratio: 0.5
  mask_close_only: true
  device: cuda
optimizer:
  name: AdamW
  lr: 0.002
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.999
scheduler:
  enabled: true
  type: cosine
  warmup_steps: 1000
  warmup_start_lr: 1.0e-07
  min_lr: 1.0e-06
  step_size: 10000
  gamma: 0.1
grad_clip:
  enabled: false
  max_norm: 1.0
checkpoint:
  dir: spt_models/dyck-mlm/v7_ds/close-only/
  save_steps:
  - 15000
wandb:
  enabled: true
  project: dyck-mlm
  entity: null
  name: v7_ds
  tags:
  - dyck_shuffle
  - mlm
  - vit-tiny
  notes: null
logging:
  print_freq: 100
  log_examples: false
