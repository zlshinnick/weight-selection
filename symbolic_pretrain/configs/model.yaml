seed: 42

model:
  name: vit_tiny_patch16_224
  num_classes: 0
  pretrained: false
  embed_dim: 192

grid: { H: 14, W: 14 }

vocab:
  K: 130
  PAD_ID: 0
  MASK_ID: 1

dyck:
  k_open: 64
  k_close: 64
  open_prob: 0.6
  min_pairs: 1

dataset:
  n_samples: 20000
  num_workers: 4
  pin_memory: true
  use_shuffled: false
  batch_size: 256

training:
  steps: 50000
  mask_ratio: 0.50
  device: cuda

optimizer:
  lr: 3.5e-4
  weight_decay: 0.05

scheduler:
  enabled: true
  type: cosine
  warmup_steps: 1000
  warmup_start_lr: 1.0e-7
  min_lr: 1.5e-5

grad_clip: { enabled: true, max_norm: 1.0 }

checkpoint:
  dir: spt_models/dyck-mlm/v1/close-only/
  save_steps: [2500, 5000, 10000, 20000, 30000, 40000, 50000]

wandb:
  enabled: true
  project: dyck-mlm
  name: v1
  tags: ["dyck","mlm","vit-tiny"]

logging:
  print_freq: 100
  log_examples: false
