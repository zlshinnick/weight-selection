seed: 42

model:
  name: vit_tiny_patch16_224
  pretrained: false

grid:
  H: 14
  W: 14

vocab:
  K: 130
  PAD_ID: 0
  MASK_ID: 1

dyck:
  k_open: 64
  k_close: 64
  open_prob: 0.6
  min_pairs: 1

dataset:
  n_samples: 20000
  num_workers: 4
  pin_memory: true
  use_shuffled: false
  batch_size: 256

dyck_gabor:
  n_freqs: 8
  n_thetas: 16
  freq_min: 0.05
  freq_max: 0.4
  bandwidth: 1.0
  sigma_x: 2.5
  sigma_y: 2.5
  n_stds: 3.0
  component: real

training:
  steps: 15000
  mask_ratio: 0.50
  device: cuda

optimizer:
  name: AdamW
  lr: 0.002
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  enabled: true
  type: cosine
  warmup_steps: 1000
  min_lr: 0.000001

grad_clip:
  enabled: false

checkpoint:
  dir: patch_models/dyck-gabor/v7/close-only/
  save_steps: [15000]

wandb:
  enabled: true
  project: dyck-mlm
  name: v7-gabor
  tags: ["dyck","mlm","gabor","vit-tiny"]

logging:
  print_freq: 100
  log_examples: false

